name: "Turok - Rage Wars (North America) v1.1"
sha1: 037fb397cee2669048ed6b762a64698de4a4d88a
options:
  basename: turok_ragewars
  target_path: baserom.us.v11.z64
  elf_path: build/turok_ragewars.elf
  base_path: .
  platform: n64
  compiler: GCC

  asm_path: asm
  src_path: src
  build_path: build
  create_asm_dependencies: True

  ld_script_path: turok_ragewars.ld
  ld_dependencies: True

  find_file_boundaries: False
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.txt
  # reloc_addrs_path:
  #   - reloc_addrs.txt

  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  hardware_regs: True

# Address-space layout (derived from the boot stub + jal-target analysis, see docs/layout.md):
#   entry stub maps TLB: VA 0x00200000 -> phys 0x000000, VA 0x00300000 -> phys 0x100000 (1 MB pages)
#   IPL3 copies ROM 0x1000.. to RAM phys 0x400 (=> ROM 0x1000 is VA 0x00200400 once TLB-mapped)
#   overlay A: VA 0x00400000 <-> ROM 0x16E000 (61% of internal jal targets hit function prologues)
segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: main
    type: code
    start: 0x1000
    vram: 0x200400
    subsegments:
      # BEGIN GENERATED main subsegments (tools/gen_yaml.py)
      - [0x1000, asm, entry]
      - [0xA2E4C, c, libultra/osSetTime]
      - [0xA2E64, asm]
      - [0xBFC6C, c, libultra/osSpTaskStartGo]
      - [0xBFC98, asm]
      - [0xBFE10, c, libultra/osSpTaskYield]
      - [0xBFE2C, asm]
      - [0xBFEA0, c, libultra/osViBlack]
      - [0xBFEFC, asm]
      - [0xC0340, c, libultra/osViSetEvent]
      - [0xC0398, asm]
      - [0xC03A0, c, libultra/osViSetMode]
      - [0xC03EC, asm]
      - [0xC05B0, c, libultra/osViSwapBuffer]
      - [0xC05F4, asm]
      - [0xC0950, c, libultra/osCreateMesgQueue]
      - [0xC0974, asm]
      - [0xC0E50, c, libultra/osJamMesg]
      - [0xC0F84, asm]
      - [0xC0F90, c, libultra/osRecvMesg]
      - [0xC10B4, asm]
      - [0xC1110, c, libultra/osSendMesg]
      - [0xC1240, asm]
      - [0xC179C, c, libultra/__osInsertTimer]
      - [0xC18A4, asm]
      - [0xC7010, bin, rsp_and_data_unsplit]
      # END GENERATED

  # 56 KB, structure unresolved: 14 x 0x1000-stride copies of one routine whose jumps
  # (e.g. j 0x4011F0) leave the 4 KB page, so 4 KB is not the true unit. Kept as raw bin for now.
  - [0x160000, bin, ovl_unresolved_160000]

  - name: ovl_a
    type: code
    start: 0x16E000
    vram: 0x400000
    exclusive_ram_id: ovl_a
    subsegments:
      - [0x16E000, asm]
      - [0x1BCDA0, bin, ovl_a_tail]

  - [0x800000]
