; controls.ini - input configuration of the Turok: Rage Wars PC port (written by turok_controls.exe, hand-editable)
;
; The game reads this file from the folder of the exe (or the path in the TUROK_CONTROLS environment variable) when it starts, and again
; whenever the file changes or F2 is pressed.  A missing or unusable file means the built-in defaults; a bad line only produces a log line.
; Lines starting with ; or # are comments, so is everything after " ;".  Names are case-insensitive.
;
; [general]  mouse_capture = auto | click | off
;               auto   the mouse is captured (hidden, kept inside the window) while a level is running and the window has the focus
;               click  captured by a click in the window (or F1), released by Esc / F1 / losing the focus
;               off    never captured, mouse look disabled (buttons and wheel still work over the window)
;             esc = confirm | quit | ignore     Esc releases the mouse; with the mouse already free, confirm = press twice to quit, quit = at once
;             rumble = on | off,  rumble_strength = 0..1      XInput vibration for the game's Rumble Pak
;             background_input = on | off        read devices while the window is not in front (default off)
;             hot_reload = on | off,  mouse_menu_guard = on | off,  show_status = on | off
;
; [player1] .. [player4]   one section per N64 controller port.
;   devices = none | keyboard, mouse, pad:auto, xinput:1..4, dinput:N, dinput:{instance guid}, dinput:name=part of the name   (comma separated)
;             pad:auto = the first connected gamepad that no other player claims (player 1 gets the first, player 2 the second, ...).
;             The keyboard may be shared between players (give each a different keyboard profile), the mouse and every gamepad serve one player.
;             Player 1 is always reported as connected; players 2-4 only while one of their devices is available.
;   settings: mouse_sens_x, mouse_sens_y (1.0 = 0.05 degrees per mouse count), mouse_smooth (0), mouse_invert_y, mouse_backlog (30 degrees), stick_deadzone (0.2),
;             stick_sens_x, stick_sens_y (1.0),
;             stick_curve (1.0 = linear, 2.0 = finer near the centre), stick_invert_y, trigger_threshold (0.3), axis_threshold (0.5), key_stick (80)
;   bindings: <N64 input> = source, source, ...      (none = nothing; "Input += source" appends to what the profile gave)
;             N64 inputs: A B Z Start DUp DDown DLeft DRight L R CUp CDown CLeft CRight StickLeft StickRight StickUp StickDown
;             sources:    keys by the PHYSICAL position of a US keyboard (W is the key right of Q on every layout): Esc F1..F12 1..0 Q..P A..L Z..M Space Enter
;                         Tab Backspace LShift RShift LCtrl RCtrl LAlt RAlt Up Down Left Right Home End PageUp PageDown Insert Delete Num0..Num9 NumEnter NumPlus
;                         NumMinus NumMul NumDiv NumDot Comma Period Slash Semicolon Quote Minus Equals LBracket RBracket Backslash Backquote, or SC:1E / SC:E048
;                         mouse: Mouse1 (left) Mouse2 (right) Mouse3 (middle) Mouse4 Mouse5, WheelUp WheelDown WheelLeft WheelRight, MouseX+ MouseX- MouseY+ MouseY-
;                         gamepad: Pad.A Pad.B Pad.X Pad.Y Pad.LB Pad.RB Pad.Back Pad.Start Pad.LS Pad.RS Pad.DUp Pad.DDown Pad.DLeft Pad.DRight Pad.LT Pad.RT
;                         Pad.LX+ Pad.LX- Pad.LY+ Pad.LY- Pad.RX+ Pad.RX- Pad.RY+ Pad.RY- (+ is right / up), raw DirectInput numbers: Pad.Btn1.. Pad.Axis1+ Pad.Hat1Up ...
;             A source can be limited to free play or to menus / pause screens with the prefix game: or menu:  (e.g. menu:Mouse1).
;             Analog sources (pad sticks, mouse motion) given to a StickXxx input move the stick proportionally; everything else gives key_stick units.
;   profile = kbm_fps, kb_left, kb_right, xbox, xbox_n64, generic     start from these built-in presets instead of the defaults of this player
;             (the lines below then override single inputs).  Hotkeys in the game: F1 capture/release the mouse, F2 reload this file, Esc release the mouse.

[general]
version = 1
mouse_capture = auto
esc = confirm
rumble = on
rumble_strength = 0.6
background_input = off
hot_reload = on
mouse_menu_guard = on
show_status = on

[player1]
devices = keyboard, mouse, pad:auto
mouse_sens_x = 1.0
mouse_sens_y = 1.0
mouse_smooth = 0.0
mouse_invert_y = off
mouse_backlog = 30.0
stick_deadzone = 0.2
stick_sens_x = 1.0
stick_sens_y = 1.0
stick_curve = 1.0
stick_invert_y = off
trigger_threshold = 0.3
axis_threshold = 0.5
key_stick = 80
A          = E, C, Mouse3, menu:Mouse1, game:WheelUp, game:WheelDown, menu:Pad.A, game:Pad.X, game:Pad.Y
B          = Mouse2, X, Backspace, Pad.B, Pad.LT
Z          = game:Mouse1, Z, LCtrl, Pad.RT
Start      = Enter, Pad.Start
DUp        = menu:W, menu:WheelUp, Num8, Pad.DUp, menu:Pad.LY+
DDown      = menu:S, menu:WheelDown, Num2, Pad.DDown, menu:Pad.LY-
DLeft      = menu:A, Num4, Pad.DLeft, menu:Pad.LX-
DRight     = menu:D, Num6, Pad.DRight, menu:Pad.LX+
L          = Q, Mouse5, Pad.LB
R          = Space, Mouse4, Pad.RB, game:Pad.A
CUp        = game:W, game:Pad.LY+
CDown      = game:S, game:Pad.LY-
CLeft      = game:A, game:Pad.LX-
CRight     = game:D, game:Pad.LX+
StickLeft  = Left, MouseX-, Pad.RX-
StickRight = Right, MouseX+, Pad.RX+
StickUp    = Up, MouseY-, Pad.RY+
StickDown  = Down, MouseY+, Pad.RY-

